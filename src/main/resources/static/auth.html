<!DOCTYPE html>
<html>
<head>
  <title>Signup & Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="tabs">
      <div id="signup-tab" class="tab active" onclick="switchTab('signup')">Sign Up</div>
      <div id="login-tab" class="tab" onclick="switchTab('login')">Log In</div>
    </div>

    <!-- Signup Form -->
    <form id="signup-form" class="active" onsubmit="submitSignup(event)">
      <input type="text" id="signup-username" placeholder="Username" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
      <div id="signup-message" class="message"></div>
    </form>

    <!-- Login Form -->
    <form id="login-form" onsubmit="submitLogin(event)">
      <input type="text" id="login-username" placeholder="Username" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Log In</button>
      <div id="login-message" class="message"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
